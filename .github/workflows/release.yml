name: Official Release

# Required repository secrets:
# - ANDROID_SIGNING_KEYSTORE_BASE64
# - ANDROID_SIGNING_STORE_PASSWORD
# - ANDROID_SIGNING_KEY_ALIAS
# - ANDROID_SIGNING_KEY_PASSWORD
# - ANDROID_BOOTSTRAP_PROPERTIES_BASE64
#
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  ANDROID_API: "26"
  GRADLE_ANDROID_NDK_VERSION: "26.3.11579264"

jobs:
  release:
    name: Build, sign, and publish release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WhiteZia
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${GRADLE_ANDROID_NDK_VERSION}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed universal ARM release APK
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_BOOTSTRAP_PROPERTIES_BASE64: ${{ secrets.ANDROID_BOOTSTRAP_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_SIGNING_KEYSTORE_BASE64 \
            ANDROID_SIGNING_STORE_PASSWORD \
            ANDROID_SIGNING_KEY_ALIAS \
            ANDROID_SIGNING_KEY_PASSWORD \
            ANDROID_BOOTSTRAP_PROPERTIES_BASE64
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing GitHub secret: ${secret_name}"
              exit 1
            fi
          done

          TAG_NAME="${GITHUB_REF_NAME}"
          KEYSTORE_PATH="${RUNNER_TEMP}/whitezia-release.keystore"
          BOOTSTRAP_PROPERTIES="${RUNNER_TEMP}/bootstrap.properties"
          echo "${ANDROID_SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          echo "${ANDROID_BOOTSTRAP_PROPERTIES_BASE64}" | base64 --decode > "${BOOTSTRAP_PROPERTIES}"

          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERTIFICATE_SHA256="$(
            keytool -exportcert \
              -alias "${ANDROID_SIGNING_KEY_ALIAS}" \
              -keystore "${KEYSTORE_PATH}" \
              -storepass "${ANDROID_SIGNING_STORE_PASSWORD}" |
              sha256sum |
              awk '{print $1}'
          )"
          RELEASE_PROPERTIES="${RUNNER_TEMP}/release.properties"
          {
            printf 'storeFile=%s\n' "${KEYSTORE_PATH}"
            printf 'storePassword=%s\n' "${ANDROID_SIGNING_STORE_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_SIGNING_KEY_ALIAS}"
            printf 'keyPassword=%s\n' "${ANDROID_SIGNING_KEY_PASSWORD}"
            printf 'certificateSha256=%s\n' "${CERTIFICATE_SHA256}"
          } > "${RELEASE_PROPERTIES}"

          VERSION_NAME="${TAG_NAME#v}"
          ./gradlew :app:assembleRelease \
            -PWHITEZIA_VERSION_NAME="${VERSION_NAME}" \
            -PWHITEZIA_RELEASE_PROPERTIES="${RELEASE_PROPERTIES}" \
            -PWHITEZIA_BOOTSTRAP_PROPERTIES="${BOOTSTRAP_PROPERTIES}"

          mkdir -p dist
          UNIVERSAL_APK="app/build/outputs/apk/release/app-universal-release.apk"
          [[ -f "${UNIVERSAL_APK}" ]] || {
            echo "::error::Universal ARM release APK was not produced."
            exit 1
          }

          for abi in arm64-v8a armeabi-v7a; do
            for library in libxray.so libtun2proxy.so libstormdns_client.so; do
              unzip -Z1 "${UNIVERSAL_APK}" "lib/${abi}/${library}" >/dev/null || {
                echo "::error::Universal APK is missing ${library} for ${abi}."
                exit 1
              }
            done
          done
          for abi in x86 x86_64; do
            if unzip -Z1 "${UNIVERSAL_APK}" "lib/${abi}/*.so" 2>/dev/null | grep -q .; then
              echo "::error::Universal ARM APK unexpectedly contains ${abi} libraries."
              exit 1
            fi
          done

          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "${UNIVERSAL_APK}"
          ACTUAL_CERTIFICATE="$(
            "${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "${UNIVERSAL_APK}" |
              awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' |
              tr -d ':'
          )"
          [[ "${ACTUAL_CERTIFICATE}" == "${CERTIFICATE_SHA256}" ]] || {
            echo "::error::APK certificate does not match the configured release key."
            exit 1
          }

          cp "${UNIVERSAL_APK}" "dist/WhiteZia-${TAG_NAME}-universal-arm.apk"

          cp THIRD_PARTY_NOTICES.md "dist/WhiteZia-${TAG_NAME}-THIRD_PARTY_NOTICES.md"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          RELEASE_TITLE="WhiteZia ${TAG_NAME}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          VERSION_NAME="${TAG_NAME#v}"
          if [[ -f "release-notes/${VERSION_NAME}.md" ]]; then
            cp "release-notes/${VERSION_NAME}.md" "${NOTES_FILE}"
          elif [[ -f "release-notes/${VERSION_NAME}.txt" ]]; then
            cp "release-notes/${VERSION_NAME}.txt" "${NOTES_FILE}"
          else
            printf '%s\n\n%s\n' \
              "Official WhiteZia release for ${TAG_NAME}." \
              "WhiteZia is not published on Google Play. APKs attached to this GitHub release are the official release artifacts for this tag."
          fi

          release_flags=()
          if [[ "${TAG_NAME}" =~ (alpha|beta|rc) ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            gh release create "${TAG_NAME}" dist/* \
              --title "${RELEASE_TITLE}" \
              --notes-file "${NOTES_FILE}" \
              "${release_flags[@]}"
          fi
