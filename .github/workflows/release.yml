name: Official Release

# Required repository secrets:
# - ANDROID_SIGNING_KEYSTORE_BASE64
# - ANDROID_SIGNING_STORE_PASSWORD
# - ANDROID_SIGNING_KEY_ALIAS
# - ANDROID_SIGNING_KEY_PASSWORD
#
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  ANDROID_API: "26"
  GRADLE_ANDROID_NDK_VERSION: "26.3.11579264"

jobs:
  release:
    name: Build, sign, and publish release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WhiteZia
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${GRADLE_ANDROID_NDK_VERSION}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed arm64 release APK
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_SIGNING_KEYSTORE_BASE64 \
            ANDROID_SIGNING_STORE_PASSWORD \
            ANDROID_SIGNING_KEY_ALIAS \
            ANDROID_SIGNING_KEY_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing GitHub secret: ${secret_name}"
              exit 1
            fi
          done

          TAG_NAME="${GITHUB_REF_NAME}"
          KEYSTORE_PATH="${RUNNER_TEMP}/whitezia-release.keystore"
          echo "${ANDROID_SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"

          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERTIFICATE_SHA256="$(
            keytool -exportcert \
              -alias "${ANDROID_SIGNING_KEY_ALIAS}" \
              -keystore "${KEYSTORE_PATH}" \
              -storepass "${ANDROID_SIGNING_STORE_PASSWORD}" |
              sha256sum |
              awk '{print $1}'
          )"
          RELEASE_PROPERTIES="${RUNNER_TEMP}/release.properties"
          {
            printf 'storeFile=%s\n' "${KEYSTORE_PATH}"
            printf 'storePassword=%s\n' "${ANDROID_SIGNING_STORE_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_SIGNING_KEY_ALIAS}"
            printf 'keyPassword=%s\n' "${ANDROID_SIGNING_KEY_PASSWORD}"
            printf 'certificateSha256=%s\n' "${CERTIFICATE_SHA256}"
          } > "${RELEASE_PROPERTIES}"

          VERSION_NAME="${TAG_NAME#v}"
          ./gradlew :app:assembleRelease \
            -PWHITEZIA_VERSION_NAME="${VERSION_NAME}" \
            -PWHITEZIA_RELEASE_PROPERTIES="${RELEASE_PROPERTIES}"

          mkdir -p dist
          ARM64_APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          [[ -f "${ARM64_APK}" ]] || {
            echo "::error::arm64-v8a release APK was not produced."
            exit 1
          }
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "${ARM64_APK}"
          ACTUAL_CERTIFICATE="$(
            "${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "${ARM64_APK}" |
              awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' |
              tr -d ':'
          )"
          [[ "${ACTUAL_CERTIFICATE}" == "${CERTIFICATE_SHA256}" ]] || {
            echo "::error::APK certificate does not match the configured release key."
            exit 1
          }

          cp "${ARM64_APK}" "dist/WhiteZia-${TAG_NAME}-arm64-v8a.apk"

          cp THIRD_PARTY_NOTICES.md "dist/WhiteZia-${TAG_NAME}-THIRD_PARTY_NOTICES.md"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          RELEASE_TITLE="WhiteZia ${TAG_NAME}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          VERSION_NAME="${TAG_NAME#v}"
          if [[ -f "release-notes/${VERSION_NAME}.md" ]]; then
            cp "release-notes/${VERSION_NAME}.md" "${NOTES_FILE}"
          else
            cat > "${NOTES_FILE}" <<EOF
            Official WhiteZia release for ${TAG_NAME}.

            WhiteZia is not published on Google Play. APKs attached to this GitHub release are the official release artifacts for this tag.
            EOF
          fi

          release_flags=()
          if [[ "${TAG_NAME}" =~ (alpha|beta|rc) ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            gh release create "${TAG_NAME}" dist/* \
              --title "${RELEASE_TITLE}" \
              --notes-file "${NOTES_FILE}" \
              "${release_flags[@]}"
          fi
